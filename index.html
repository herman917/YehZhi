            const chapter = chapters.find(c => c.id === id);
            
            if(isDrawerOpen) toggleDrawer();
            
            document.getElementById('reader-chapter-title').innerText = chapter.title;
            
            document.getElementById('reader-content').innerHTML = `
                ${chapter.content}
            `;

            switchView('reader');

            if (id === 1) {
                const ytIframe = document.getElementById('ch1-video');
                if (ytIframe) {
                    ytIframe.src = "https://www.youtube.com/embed/ArK40Oi-UFE?si=c2B6EHzAbmKQHaLx&autoplay=1";
                }
            }
        }

        // 顯示加入桌面提示
        function showInstallHelp() {
            const modal = document.getElementById('install-modal');
            const instructions = document.getElementById('install-instructions');
            
            const userAgent = navigator.userAgent.toLowerCase();
            if (/iphone|ipad|ipod/.test(userAgent)) {
                instructions.innerHTML = "<b>iPhone / iPad (Safari) 操作方式：</b><br>請點擊下方工具列的 <b>「分享」</b> 按鈕（正方形帶箭頭），然後選擇 <b>「加入主畫面」</b> 即可！";
            } else if (/android/.test(userAgent)) {
                instructions.innerHTML = "<b>Android (Chrome) 操作方式：</b><br>請點擊右上角的 <b>「三點選單」</b>，然後選擇 <b>「加到主畫面」</b> 或 <b>「安裝應用程式」</b> 即可！";
            } else {
                instructions.innerHTML = "<b>電腦版操作方式：</b><br>請按鍵盤快捷鍵 <b>Ctrl + D</b>（Windows）或 <b>Cmd + D</b>（Mac）將本網頁加入我的最愛，或透過瀏覽器選單選擇「安裝應用程式」！";
            }
            modal.classList.add('flex');
            modal.classList.remove('hidden');
        }

        function closeInstallModal() {
            const modal = document.getElementById('install-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
</html>
