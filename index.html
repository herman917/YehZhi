                drawer.classList.remove('-translate-x-full');

        // View Switching Logic

            const tabHome = document.getElementById('tab-home');
            const ytIframe = document.getElementById('ch1-video');

            if (viewName === 'home') {
                viewHome.classList.replace('view-hidden', 'view-active');
                viewReader.classList.replace('view-active', 'view-hidden');
                tabHome.classList.add('text-brand-600');

                if (ytIframe) ytIframe.src = "";
            } else if (viewName === 'reader') {

                viewReader.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function renderTOC() {

        }

        function openChapter(id) {
            currentChapterId = id;
            const chapter = chapters.find(c => c.id === id);
            
            if(isDrawerOpen) toggleDrawer();
            
            document.getElementById('reader-chapter-title').innerText = chapter.title;
            
            document.getElementById('reader-content').innerHTML = `

                <p class="text-base text-slate-500 mb-6 font-medium">${chapter.subtitle}</p>
                ${chapter.content}
            `;

            switchView('reader');
            closeSearchModal();

            if (id === 1) {
                const ytIframe = document.getElementById('ch1-video');
                if (ytIframe) {
                    ytIframe.src = "https://www.youtube.com/embed/ArK40Oi-UFE?si=c2B6EHzAbmKQHaLx&autoplay=1";
                }
            }
        }

        // Search Logic
        function openSearchModal() {
            document.getElementById('search-modal').classList.remove('translate-y-full');
            setTimeout(() => document.getElementById('search-input').focus(), 300);
        }

        function closeSearchModal() {
            document.getElementById('search-modal').classList.add('translate-y-full');
            document.getElementById('search-input').value = '';
            document.getElementById('search-results').innerHTML = `
                <div class="flex flex-col items-center justify-center h-48 text-slate-400">

                    <p class="text-base">輸入關鍵字開始搜尋</p>
                </div>
            `;
        }

        function performSearch(query) {
            const container = document.getElementById('search-results');
            if (!query.trim()) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-48 text-slate-400">
                        <i class="fa-solid fa-keyboard text-4xl mb-3 opacity-50"></i>
                        <p class="text-base">輸入關鍵字開始搜尋</p>
                    </div>`;
                return;
            }

            let matches = [];
            chapters.forEach(ch => {
                const textContent = ch.content.replace(/<[^>]*>?/gm, '');
                if (ch.title.includes(query) || ch.subtitle.includes(query) || textContent.includes(query)) {
                    matches.push(ch);
                }
            });

            if (matches.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-48 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-4xl mb-3 opacity-50"></i>
                        <p class="text-base">找不到「${query}」相關內容</p>
                    </div>`;
                return;
            }

            container.innerHTML = matches.map(m => `
                <button onclick="openChapter(${m.id})" class="w-full text-left bg-white p-5 rounded-xl shadow-sm border border-slate-100 active:bg-brand-50 transition">
                    <h4 class="font-bold text-slate-900 text-lg">${m.title}</h4>
                    <p class="text-base text-slate-500 mt-2 truncate">${m.subtitle}</p>
                </button>
            `).join('');
        }
