            {
                id: 10,
                title: "師兄姐心得收錄",
                subtitle: "真實案例與奇蹟見證",
                icon: "fa-users",
                content: `
                    <div class="space-y-5">

                            <p class="text-xs text-brand-200 mt-1">用心體悟，相信自己身體的自癒力</p>
                        </div>

                        <!-- Testimonial 1 -->
                        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">

                                <span class="text-[10px] text-slate-400 font-mono">2026/10/6</span>
                            </div>
                            <div class="p-4 text-sm text-slate-600 leading-relaxed space-y-2">
                                <p>當我聽到醫生給我宣判結果第四期，心情低落到吃不下睡不著。當絕望時，老天幫我開了一條路，看到葉子老師猿猴式超慢跑。</p>
                                <p>我開始調整作息，每天5點及下午3點做一次。跑了一個月後發現臉型紅嫩，指甲的血色及手的冰冷都改善了，流的每一滴汗都是珍貴膠原蛋白。謝謝老師及師兄姐的動作調整，我會努力加油讓自己健康活出一道光。</p>
                            </div>
                        </div>

                        <!-- Testimonial 2 -->
                        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                            <div class="bg-slate-50 px-4 py-3 border-b border-slate-100 flex justify-between items-center">
                                <h3 class="font-bold text-slate-800 text-sm">李OO (全身性濕疹奇蹟)</h3>
                                <span class="text-[10px] text-slate-400 font-mono">2026/7/29</span>
                            </div>
                            <div class="p-4 text-sm text-slate-600 leading-relaxed space-y-2">
                                <p>皮膚全身性濕疹，有藥吃到沒藥... 決定不吃，練超慢跑。結果跑了2、3個月後，長濕疹處整個慢慢脫皮，慢慢好起來，真是奇蹟！</p>
                                <p>真心感謝葉子老師！真的要每天認真跑，不掉隊，補陽氣才是王道！</p>
                            </div>
                        </div>
                    </div>
                `
            }
        ];

        let currentChapterId = 1;
        let currentView = 'home'; // 'home' or 'reader'
        let isDrawerOpen = false;

        document.addEventListener('DOMContentLoaded', () => {
            renderTOC();
            renderDrawerList();
        });

        // Toggle Side Drawer
        function toggleDrawer() {
            const drawer = document.getElementById('drawer-menu');
            const overlay = document.getElementById('drawer-overlay');
            
            isDrawerOpen = !isDrawerOpen;
            if (isDrawerOpen) {
                drawer.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                // slight delay for transition
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                drawer.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        // View Switching Logic
        function switchView(viewName) {
            currentView = viewName;
            
            const viewHome = document.getElementById('view-home');
            const viewReader = document.getElementById('view-reader');
            const tabHome = document.getElementById('tab-home');
            const ytIframe = document.getElementById('ch1-video');

            if (viewName === 'home') {
                viewHome.classList.replace('view-hidden', 'view-active');
                viewReader.classList.replace('view-active', 'view-hidden');
                tabHome.classList.add('text-brand-600');
                tabHome.classList.remove('text-slate-400');
                
                // Stop YouTube Video if playing
                if (ytIframe) ytIframe.src = "";
            } else if (viewName === 'reader') {
                viewHome.classList.replace('view-active', 'view-hidden');
                viewReader.classList.replace('view-hidden', 'view-active');
                tabHome.classList.remove('text-brand-600');
                tabHome.classList.add('text-slate-400');
                
                // Scroll reader to top smoothly
                viewReader.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function renderTOC() {
            const list = document.getElementById('mobile-toc-list');
            list.innerHTML = chapters.map(ch => `
                <button onclick="openChapter(${ch.id})" class="w-full flex items-center justify-between py-2 px-4 bg-white active:bg-slate-50 transition">
                    <div class="flex items-center space-x-3 text-left">
                        <div class="w-8 h-8 rounded-lg bg-brand-50 text-brand-600 flex items-center justify-center shrink-0">
                            <i class="fa-solid ${ch.icon} text-sm"></i>
                        </div>
                        <div>
                            <span class="block font-bold text-slate-800 text-sm leading-tight">${ch.title}</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                </button>
            `).join('');
        }
        
        function renderDrawerList() {
            const list = document.getElementById('drawer-list');
            list.innerHTML = chapters.map(ch => `
                <button onclick="openChapter(${ch.id})" class="w-full flex items-center space-x-3 py-3 px-3 text-left rounded-lg active:bg-slate-50 text-slate-700 hover:text-brand-600 transition">
                    <i class="fa-solid ${ch.icon} w-5 text-center text-slate-400"></i>
                    <span class="font-bold text-sm truncate">${ch.title}</span>
                </button>
            `).join('');
        }

        function openChapter(id) {
            currentChapterId = id;
            const chapter = chapters.find(c => c.id === id);
            
            // Close drawer if open
            if(isDrawerOpen) toggleDrawer();
            
            // Update Reader Header
            document.getElementById('reader-chapter-title').innerText = chapter.title;
            
            // Inject Content
            document.getElementById('reader-content').innerHTML = `
                <h2 class="text-2xl font-black text-slate-900 mb-1 leading-tight">${chapter.title}</h2>
                <p class="text-sm text-slate-500 mb-6 font-medium">${chapter.subtitle}</p>
                ${chapter.content}
            `;

            switchView('reader');
            closeSearchModal();

            // Handle YouTube Auto-play for Chapter 1
            if (id === 1) {
                const ytIframe = document.getElementById('ch1-video');
                if (ytIframe) {
                    ytIframe.src = "https://www.youtube.com/embed/ArK40Oi-UFE?si=c2B6EHzAbmKQHaLx&autoplay=1";
                }
            }
        }

        // Pacer Timer Logic
        let pacerInterval = null;
        let isPacerRunning = false;
        let pacerStep = 0;

        function openTimerModal() {
            document.getElementById('timer-modal').classList.remove('translate-y-full');
        }

        function closeTimerModal() {
            document.getElementById('timer-modal').classList.add('translate-y-full');
            stopPacer();
        }

        function togglePacer() {
            if (isPacerRunning) {
                stopPacer();
            } else {
                startPacer();
            }
        }

        function startPacer() {
            isPacerRunning = true;
            document.getElementById('pacer-btn-text').innerText = '暫停';
            document.getElementById('pacer-btn-icon').className = 'fa-solid fa-pause';
            
            const btn = document.getElementById('start-timer-btn');
            btn.classList.replace('bg-brand-600', 'bg-slate-800');
            
            pacerInterval = setInterval(() => {
                pacerStep++;
                const actionEl = document.getElementById('pacer-action');
                const subEl = document.getElementById('pacer-sub');
                const circle = document.getElementById('pacer-circle');
                const pulse = document.getElementById('pacer-pulse');

                // Visual Pulse
                pulse.style.opacity = '0.3';
                pulse.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    pulse.style.opacity = '0';
                    pulse.style.transform = 'scale(1)';
                }, 200);

                if (pacerStep % 2 === 1) {
                    actionEl.innerText = '右腳 🦶';
                    subEl.innerText = '吐氣 + 提肛';
                    circle.classList.add('bg-brand-100', 'border-brand-500');
                    circle.classList.remove('bg-slate-50', 'border-slate-100');
                } else {
                    actionEl.innerText = '左腳 🏃';
                    subEl.innerText = '自然吸氣';
                    circle.classList.remove('bg-brand-100', 'border-brand-500');
                    circle.classList.add('bg-slate-50', 'border-slate-100');
                }
            }, 500); // 120bpm
        }

        function stopPacer() {
            isPacerRunning = false;
            clearInterval(pacerInterval);
            document.getElementById('pacer-btn-text').innerText = '開始節拍';
            document.getElementById('pacer-btn-icon').className = 'fa-solid fa-play';
            document.getElementById('start-timer-btn').classList.replace('bg-slate-800', 'bg-brand-600');
            
            document.getElementById('pacer-action').innerText = '準備';
            document.getElementById('pacer-sub').innerText = '點擊下方開始';
            
            const circle = document.getElementById('pacer-circle');
            circle.classList.remove('bg-brand-100', 'border-brand-500');
            circle.classList.add('bg-slate-50', 'border-slate-100');
            pacerStep = 0;
        }

        function resetPacer() { stopPacer(); }

        // Search Logic
        function openSearchModal() {
            document.getElementById('search-modal').classList.remove('translate-y-full');
            setTimeout(() => document.getElementById('search-input').focus(), 300);
        }

        function closeSearchModal() {
            document.getElementById('search-modal').classList.add('translate-y-full');
            document.getElementById('search-input').value = '';
            document.getElementById('search-results').innerHTML = `
                <div class="flex flex-col items-center justify-center h-40 text-slate-400">
                    <i class="fa-solid fa-keyboard text-3xl mb-2 opacity-50"></i>
                    <p class="text-xs">輸入關鍵字開始搜尋</p>
                </div>
            `;
        }

        function performSearch(query) {
            const container = document.getElementById('search-results');
            if (!query.trim()) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-40 text-slate-400">
                        <i class="fa-solid fa-keyboard text-3xl mb-2 opacity-50"></i>
                        <p class="text-xs">輸入關鍵字開始搜尋</p>
                    </div>`;
                return;
            }

            let matches = [];
            chapters.forEach(ch => {
                const textContent = ch.content.replace(/<[^>]*>?/gm, '');
                if (ch.title.includes(query) || ch.subtitle.includes(query) || textContent.includes(query)) {
                    matches.push(ch);
                }
            });

            if (matches.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-40 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-3xl mb-2 opacity-50"></i>
                        <p class="text-xs">找不到「${query}」相關內容</p>
                    </div>`;
                return;
            }

            container.innerHTML = matches.map(m => `
                <button onclick="openChapter(${m.id})" class="w-full text-left bg-white p-4 rounded-xl shadow-sm border border-slate-100 active:bg-brand-50 transition">
                    <h4 class="font-bold text-slate-800 text-sm">${m.title}</h4>
                    <p class="text-xs text-slate-500 mt-1 truncate">${m.subtitle}</p>
                </button>
            `).join('');
        }
    </script>
</body>
</html>
